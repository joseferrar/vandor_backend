name: Deploy to AWS EC2

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Node.js App via SSH
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          set -euo pipefail

          # 1. Validate required GitHub Secrets
          : "${EC2_HOST:?Missing EC2_HOST secret in GitHub repository settings}"
          : "${EC2_USER:?Missing EC2_USER secret in GitHub repository settings}"
          : "${EC2_SSH_KEY:?Missing EC2_SSH_KEY secret in GitHub repository settings}"
          : "${EC2_APP_DIR:?Missing EC2_APP_DIR secret in GitHub repository settings}"

          # 2. Configure SSH key (strip Windows CRLF line endings) and known_hosts
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "==> Verifying SSH private key format..."
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub; then
            echo "ERROR: EC2_SSH_KEY is not a valid private key. Make sure you copied the full .pem file including BEGIN and END lines."
            exit 1
          fi
          echo "Public key fingerprint:"
          ssh-keygen -lf ~/.ssh/deploy_key.pub

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # 3. Connect to EC2 and deploy
          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o PubkeyAcceptedAlgorithms=+ssh-rsa \
            -o HostkeyAlgorithms=+ssh-rsa \
            "$EC2_USER@$EC2_HOST" \
            'bash -s' -- "$EC2_APP_DIR" << 'EOF'
          set -euo pipefail

          APP_DIR="$1"

          # Load NVM if Node/PM2 were installed via NVM
          export NVM_DIR="$HOME/.nvm"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            . "$NVM_DIR/nvm.sh"
          fi

          echo "==> Navigating to $APP_DIR"
          cd "$APP_DIR"

          echo "==> Pulling latest code from origin/master"
          git fetch origin master
          git reset --hard origin/master

          echo "==> Installing production dependencies"
          npm ci --omit=dev

          echo "==> Restarting PM2 process (server)"
          if pm2 describe server > /dev/null 2>&1; then
            pm2 restart server --update-env
          else
            pm2 start server.js --name server
          fi

          pm2 save
          pm2 status
          echo "==> Deployment completed successfully!"
          EOF
