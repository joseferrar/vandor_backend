name: Deploy to EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Node.js application
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}

        run: |
          set -euo pipefail

          # Validate required GitHub secrets
          : "${EC2_HOST:?Missing EC2_HOST secret}"
          : "${EC2_USER:?Missing EC2_USER secret}"
          : "${EC2_SSH_KEY:?Missing EC2_SSH_KEY secret}"
          : "${EC2_APP_DIR:?Missing EC2_APP_DIR secret}"

          # Configure SSH
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Add EC2 host key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # Connect and deploy
          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            'bash -s' -- "$EC2_APP_DIR" <<'REMOTE'
          set -euo pipefail

          APP_DIR="$1"

          cd "$APP_DIR"

          echo "Fetching latest code..."
          git fetch origin master
          git reset --hard origin/master

          echo "Installing production dependencies..."
          npm ci --omit=dev

          echo "Restarting PM2 application..."
          pm2 restart server --update-env

          pm2 save
          pm2 status

          echo "Deployment completed successfully."
          REMOTE