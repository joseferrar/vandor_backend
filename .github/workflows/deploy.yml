steps:
  - name: Deploy through SSH
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}

    shell: bash
    run: |
      set -euo pipefail

      # Validate required secrets
      : "${EC2_HOST:?Missing EC2_HOST secret}"
      : "${EC2_USER:?Missing EC2_USER secret}"
      : "${EC2_SSH_KEY:?Missing EC2_SSH_KEY secret}"
      : "${EC2_APP_DIR:?Missing EC2_APP_DIR secret}"

      # Configure SSH
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh

      printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
      chmod 600 ~/.ssh/deploy_key

      # Add EC2 host key
      ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
      chmod 600 ~/.ssh/known_hosts

      # Deploy to EC2
      ssh \
        -i ~/.ssh/deploy_key \
        -o IdentitiesOnly=yes \
        -o StrictHostKeyChecking=yes \
        "$EC2_USER@$EC2_HOST" \
        "bash -s -- '$EC2_APP_DIR'" <<'REMOTE'
      set -euo pipefail

      APP_DIR="$1"

      cd "$APP_DIR"

      echo "Pulling latest code..."
      git pull --ff-only origin master

      echo "Installing production dependencies..."
      npm ci --omit=dev

      echo "Restarting Node.js application..."
      pm2 restart server --update-env

      pm2 save
      pm2 status

      echo "Deployment completed successfully."
      REMOTE
